<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgi Yurakchasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="animation-container" id="heartContainer">
        <!-- Asosiy vertikal yurakcha -->
        <div class="heart" id="mainHeart"></div>

        <!-- Atrofidagi sevgi effektlari -->
        <div class="floating-heart fh1">❤</div>
        <div class="floating-heart fh2">💖</div>
        <div class="floating-heart fh3">💕</div>
        <div class="floating-heart fh4">💗</div>
        
        <div class="sparkle sp1"></div>
        <div class="sparkle sp2"></div>
        <div class="sparkle sp3"></div>
    </div>

    <!-- JavaScript faylini ulaymiz yoki shu yerga yozamiz -->
    <script src="script.js"></script>
</body>
</html>
